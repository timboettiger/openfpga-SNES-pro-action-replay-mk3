; PlatformIO project for the XBAND ESP32 bridge firmware.
;
; Build the two modes explicitly:
;   pio run -e mode2_wifi      ; Mode 2: link <-> Wi-Fi/server (default)
;   pio run -e mode1_linklink  ; Mode 1: link <-> link (two Pockets)
;   pio run -e native_test     ; host-side Bridge unit test (no hardware)
;
; Provide Wi-Fi credentials & server host via build_flags or environment; do NOT
; commit real secrets.

[platformio]
default_envs = mode2_wifi

[env]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
build_flags =
    -Iinclude
    -std=gnu++11

[env:mode2_wifi]
build_flags =
    ${env.build_flags}
    -DXBAND_MODE=2
    ; -DWIFI_SSID='"my-ssid"'
    ; -DWIFI_PASS='"my-pass"'
    ; -DXBAND_SERVER_HOST='"192.168.1.10"'
    ; -DXBAND_SERVER_PORT=7654

[env:mode1_linklink]
build_flags =
    ${env.build_flags}
    -DXBAND_MODE=1

; Host-native environment that builds & runs test/test_bridge.cpp on the PC.
[env:native_test]
platform = native
build_flags =
    -Iinclude
    -std=c++11
test_framework = custom
